<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Sandforce Heavy Equipment Parts</title>
  
  <!-- GitHub Pages Clean URL Router -->
  <script>
    (function () {
      var path = window.location.pathname;
      var cleanRoute = path.split('/').filter(Boolean).pop();
      var knownPages = ['products', 'industries', 'about', 'contact'];

      if (cleanRoute && knownPages.indexOf(cleanRoute.toLowerCase()) !== -1) {
        // Find if this is inside a repo subdirectory e.g. /my-repo/contact
        var target = path + '.html' + window.location.search + window.location.hash;
        window.location.replace(target);
      } else {
        window.location.replace('./');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./">
</head>
<body style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color:#F8F9FA; color:#0B2238; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center;">
  <div>
    <h2 style="font-size:1.5rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:0.5rem;">Sandforce Heavy Equipment Parts</h2>
    <p style="color:#64748B; font-size:0.95rem;">Navigating to requested page...</p>
  </div>
</body>
</html>
